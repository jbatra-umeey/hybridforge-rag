groups:
  - name: hybridforge
    rules:
      - alert: RAGHighErrorRatio
        expr: sum(rate(rag_operations_total{outcome=~"error|provider_error"}[5m])) / clamp_min(sum(rate(rag_operations_total[5m])), 0.01) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: More than 5 percent of RAG operations are failing
      - alert: RAGQueryLatencyHigh
        expr: histogram_quantile(0.95, sum by(le) (rate(rag_operation_seconds_bucket{operation="query"}[5m]))) > 15
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Query p95 exceeded the provisional 15 second target
