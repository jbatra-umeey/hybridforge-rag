name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: pytest -m 'not postgres' --cov=hybridforge --cov-report=term-missing
      - run: python scripts/evaluate.py --output evals/ci-results.json
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ci-disposable-admin-only
          POSTGRES_DB: hybridforge
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:ci-disposable-admin-only@127.0.0.1:5432/hybridforge
      RAG_DB_PASSWORD: ci-disposable-app-password
      TEST_DATABASE_URL: postgresql://rag_app:ci-disposable-app-password@127.0.0.1:5432/hybridforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: python scripts/migrate.py
      - run: pytest -m postgres -q
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f compose.postgres.yaml run --build --rm tests
      - if: always()
        run: docker compose -f compose.postgres.yaml down -v
